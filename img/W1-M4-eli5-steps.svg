<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-label="걸음 수가 로봇의 반응 시간이 된다">
  <rect x="0" y="0" width="940" height="420" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">
    <text x="40" y="42" font-size="21" font-weight="700" fill="#2d3142">걸음 수가 그대로 로봇의 반응 시간이 됩니다</text>
    <text x="40" y="68" font-size="14.5" fill="#4f5d75">막대 길이는 시간에 비례합니다. 파란 세로선이 넘어서는 안 되는 선입니다</text>

    <text x="60" y="128" font-size="14" font-weight="700" fill="#4f5d75">걸음 수</text>
    <text x="200" y="128" font-size="14" font-weight="700" fill="#4f5d75">눈을 감고 있는 시간</text>

    <rect x="52" y="146" width="112" height="46" rx="7" fill="#fbeae4" stroke="#c4501f" stroke-width="2.2"/>
    <text x="108" y="176" font-size="17" font-weight="700" fill="#a8410f" text-anchor="middle">250번</text>
    <rect x="200" y="158" width="560" height="24" rx="3" fill="#c4501f"/>
    <text x="772" y="176" font-size="14" font-weight="700" fill="#a8410f">1.64초</text>

    <rect x="52" y="216" width="112" height="46" rx="7" fill="#f8f3ea" stroke="#b8762e" stroke-width="2"/>
    <text x="108" y="246" font-size="17" font-weight="700" fill="#8a5518" text-anchor="middle">10번</text>
    <rect x="200" y="228" width="68" height="24" rx="3" fill="#b8762e"/>
    <text x="280" y="246" font-size="14" font-weight="700" fill="#8a5518">0.2초</text>

    <rect x="52" y="286" width="112" height="46" rx="7" fill="#e7f0e9" stroke="#3f7d55" stroke-width="2.2"/>
    <text x="108" y="316" font-size="17" font-weight="700" fill="#2c5b3c" text-anchor="middle">4번</text>
    <rect x="200" y="298" width="61" height="24" rx="3" fill="#3f7d55"/>
    <text x="273" y="316" font-size="14" font-weight="700" fill="#2c5b3c">0.18초</text>

    <line x1="268" y1="140" x2="268" y2="344" stroke="#2f6f9f" stroke-width="2.4" stroke-dasharray="7,5"/>
    <text x="284" y="356" font-size="13.5" font-weight="700" fill="#1f4f74">0.2초</text>

    <rect x="40" y="366" width="860" height="42" rx="8" fill="#e8f0f7" stroke="#2f6f9f" stroke-width="1.6"/>
    <text x="58" y="392" font-size="13.5" fill="#1f4f74">파란 선은 발이 미끄러지고 자세가 무너질 때까지 남은 시간입니다. 맨 위 막대는 그 선을 한참 넘어갑니다.</text>
  </g>
</svg>
