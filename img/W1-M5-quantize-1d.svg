<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="연속값이 눌리고 반올림돼 격자 위 한 점이 되는 과정">
  <rect x="0" y="0" width="960" height="430" fill="#f8f7f4"/>
  <defs>
    <marker id="m5arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
  </defs>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">
    <text x="36" y="40" font-size="21" font-weight="700" fill="#2d3142">채널 하나가 눈금 하나로 붙기까지</text>
    <text x="36" y="66" font-size="14.5" fill="#4f5d75">눈금이 다섯 개인 채널입니다. 왼쪽에서 오른쪽으로 세 칸을 차례로 보세요</text>

    <text x="60" y="112" font-size="15" font-weight="700" fill="#2b5280">1. 인코더가 낸 값</text>
    <line x1="60" y1="160" x2="300" y2="160" stroke="#9aa6b2" stroke-width="2"/>
    <line x1="60" y1="154" x2="60" y2="166" stroke="#9aa6b2" stroke-width="2"/>
    <line x1="300" y1="154" x2="300" y2="166" stroke="#9aa6b2" stroke-width="2"/>
    <text x="52" y="184" font-size="12.5" fill="#8a5518">아주 작은 값</text>
    <text x="264" y="184" font-size="12.5" fill="#8a5518">아주 큰 값</text>
    <circle cx="212" cy="160" r="7" fill="#3d6ea8"/>
    <text x="212" y="142" font-size="13" font-weight="700" fill="#2b5280" text-anchor="middle">0.9</text>
    <text x="60" y="214" font-size="13" fill="#4f5d75">범위에 제한이 없습니다</text>

    <line x1="316" y1="160" x2="356" y2="160" stroke="#4f5d75" stroke-width="2" marker-end="url(#m5arrG)"/>
    <text x="304" y="140" font-size="12.5" fill="#4f5d75">누르기</text>

    <text x="372" y="112" font-size="15" font-weight="700" fill="#2b5280">2. 유한한 폭으로 누른다</text>
    <line x1="372" y1="160" x2="612" y2="160" stroke="#9aa6b2" stroke-width="2"/>
    <line x1="372" y1="150" x2="372" y2="170" stroke="#3d6ea8" stroke-width="2.4"/>
    <line x1="612" y1="150" x2="612" y2="170" stroke="#3d6ea8" stroke-width="2.4"/>
    <text x="372" y="188" font-size="12.5" fill="#2b5280" text-anchor="middle">-2</text>
    <text x="612" y="188" font-size="12.5" fill="#2b5280" text-anchor="middle">+2</text>
    <circle cx="578" cy="160" r="7" fill="#3d6ea8"/>
    <text x="578" y="142" font-size="13" font-weight="700" fill="#2b5280" text-anchor="middle">1.433</text>
    <text x="372" y="214" font-size="13" fill="#4f5d75">어떤 값이 들어와도 이 폭 안입니다</text>

    <line x1="628" y1="160" x2="668" y2="160" stroke="#4f5d75" stroke-width="2" marker-end="url(#m5arrG)"/>
    <text x="618" y="140" font-size="12.5" fill="#4f5d75">반올림</text>

    <text x="684" y="112" font-size="15" font-weight="700" fill="#2c5b3c">3. 가장 가까운 눈금</text>
    <rect x="684" y="146" width="46" height="28" fill="#eef1f5"/>
    <rect x="730" y="146" width="46" height="28" fill="#ffffff"/>
    <rect x="776" y="146" width="46" height="28" fill="#eef1f5"/>
    <rect x="822" y="146" width="46" height="28" fill="#ffffff"/>
    <rect x="868" y="146" width="46" height="28" fill="#eef1f5"/>
    <line x1="684" y1="160" x2="914" y2="160" stroke="#9aa6b2" stroke-width="2"/>
    <g fill="#3f7d55">
      <circle cx="707" cy="160" r="6"/><circle cx="753" cy="160" r="6"/><circle cx="799" cy="160" r="6"/>
      <circle cx="845" cy="160" r="9"/><circle cx="891" cy="160" r="6"/>
    </g>
    <text x="701" y="188" font-size="12.5" fill="#2c5b3c">-2</text>
    <text x="747" y="188" font-size="12.5" fill="#2c5b3c">-1</text>
    <text x="795" y="188" font-size="12.5" fill="#2c5b3c">0</text>
    <text x="841" y="188" font-size="12.5" font-weight="700" fill="#2c5b3c">1</text>
    <text x="887" y="188" font-size="12.5" fill="#2c5b3c">2</text>
    <text x="684" y="214" font-size="13" fill="#4f5d75">눈금 다섯 개 중 하나로 붙습니다</text>

    <rect x="560" y="240" width="46" height="18" fill="#eef1f5" stroke="#c9ccd4" stroke-width="1.2"/>
    <text x="616" y="254" font-size="13" fill="#a8410f">이 띠 안에서는 값이 움직여도 결과가 같습니다</text>

    <rect x="36" y="292" width="888" height="112" rx="8" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/>
    <text x="56" y="320" font-size="14" font-weight="700" fill="#2d3142">이 그림이 말하는 것 셋</text>
    <text x="56" y="346" font-size="13.5" fill="#4f5d75">첫째, 2번 칸의 폭은 눈금 개수가 정합니다. 눈금이 다섯이면 폭이 -2에서 +2입니다.</text>
    <text x="56" y="368" font-size="13.5" fill="#4f5d75">둘째, 3번 칸의 눈금 자리는 학습되지 않습니다. 처음부터 저 자리에 그냥 놓여 있습니다.</text>
    <text x="56" y="390" font-size="13.5" fill="#4f5d75">셋째, 회색 띠의 폭이 이 채널로 표현할 수 없는 가장 작은 변화량이고 본문 §3의 데드밴드가 그것입니다.</text>
  </g>
</svg>
