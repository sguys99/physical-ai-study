<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="길이 겹치는 곳에서는 어느 쪽도 아닌 방향으로 간다">
  <rect x="0" y="0" width="900" height="430" fill="#f8f7f4"/>
  <defs>
    <marker id="e4xa" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3f7d55"/>
    </marker>
  </defs>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">
    <text x="40" y="42" font-size="21" font-weight="700" fill="#2d3142">길이 겹치는 곳에서는 가운데로 갑니다</text>
    <text x="40" y="68" font-size="14.5" fill="#4f5d75">곧은 길을 여러 개 그어도 겹치는 자리가 생기고 거기서 길이 휩니다</text>

    <line x1="130" y1="160" x2="700" y2="290" stroke="#9aa6b2" stroke-width="3.4"/>
    <line x1="130" y1="290" x2="700" y2="160" stroke="#9aa6b2" stroke-width="3.4"/>
    <circle cx="130" cy="160" r="9" fill="#2f6f9f"/>
    <circle cx="130" cy="290" r="9" fill="#2f6f9f"/>
    <circle cx="700" cy="160" r="9" fill="#b8762e"/>
    <circle cx="700" cy="290" r="9" fill="#b8762e"/>
    <text x="112" y="156" font-size="13.5" fill="#1f4f74" text-anchor="end">출발 하나</text>
    <text x="112" y="296" font-size="13.5" fill="#1f4f74" text-anchor="end">출발 둘</text>
    <text x="716" y="156" font-size="13.5" fill="#8a5518">도착 하나</text>
    <text x="716" y="296" font-size="13.5" fill="#8a5518">도착 둘</text>

    <circle cx="415" cy="225" r="9" fill="#3f7d55"/>
    <line x1="415" y1="225" x2="540" y2="225" stroke="#3f7d55" stroke-width="4.4" marker-end="url(#e4xa)"/>
    <rect x="421" y="188" width="278" height="22" rx="4" fill="#f8f7f4"/>
    <text x="428" y="204" font-size="14.5" font-weight="700" fill="#2c5b3c">여기서는 두 방향의 가운데로 갑니다</text>
    <rect x="421" y="242" width="262" height="20" rx="4" fill="#f8f7f4"/>
    <text x="428" y="256" font-size="13.5" fill="#3f7d55">위쪽 길도 아니고 아래쪽 길도 아닙니다</text>

    <rect x="40" y="330" width="820" height="76" rx="9" fill="#fbeee2" stroke="#c4501f" stroke-width="1.6"/>
    <text x="58" y="356" font-size="14" font-weight="700" fill="#a8410f">그래서 곧은 길을 그어도 실제로 걷는 길은 조금 휩니다</text>
    <text x="58" y="380" font-size="13.5" fill="#b8762e">겹치는 자리마다 방향이 섞이기 때문입니다. 이것을 고치는 방법이 본문 뒤쪽에 나옵니다.</text>
    <text x="58" y="398" font-size="13.5" fill="#b8762e">한 번 걸어본 결과로 출발점과 도착점을 다시 짝지어 주면 겹침이 크게 줄어듭니다.</text>
  </g>
</svg>
