      <rect x="606" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="630" y="332" width="20" height="20" rx="3" fill="#c4501f"/><rect x="654" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="678" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="702" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="726" y="332" width="20" height="20" rx="3" fill="#c4501f"/><rect x="750" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="774" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="798" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="822" y="332" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/>
      <rect x="606" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="630" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="654" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="678" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="702" y="356" width="20" height="20" rx="3" fill="#c4501f"/><rect x="726" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="750" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="774" y="356" width="20" height="20" rx="3" fill="#c4501f"/><rect x="798" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/><rect x="822" y="356" width="20" height="20" rx="3" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.4"/>
