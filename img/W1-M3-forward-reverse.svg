<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" role="img" aria-label="노이즈를 넣는 방향과 걷어내는 방향">
  <rect x="0" y="0" width="1020" height="470" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">

    <text x="40" y="44" font-size="22" font-weight="700" fill="#2d3142">한 사슬을 두 방향으로 읽습니다</text>
    <text x="40" y="72" font-size="15" fill="#4f5d75">위로 가는 화살표에는 학습되는 값이 하나도 없고, 아래로 오는 화살표만 신경망이 배웁니다</text>

    <!-- 상태 카드 5개 -->
    <g>
      <rect x="48" y="176" width="140" height="96" rx="9" fill="#e7f0e9" stroke="#3f7d55" stroke-width="2"/>
      <text x="118" y="208" font-size="16" font-weight="700" fill="#2c5b3c" text-anchor="middle">t = 0</text>
      <text x="118" y="232" font-size="13" fill="#3f7d55" text-anchor="middle">원래 데이터</text>
      <text x="118" y="252" font-size="13" fill="#3f7d55" text-anchor="middle">신호 100%</text>
    </g>
    <g>
      <rect x="238" y="176" width="140" height="96" rx="9" fill="#eef4ee" stroke="#6a9c7c" stroke-width="2"/>
      <text x="308" y="208" font-size="16" font-weight="700" fill="#2c5b3c" text-anchor="middle">t = 100</text>
      <text x="308" y="232" font-size="13" fill="#4f5d75" text-anchor="middle">신호가 0.947배</text>
      <text x="308" y="252" font-size="13" fill="#4f5d75" text-anchor="middle">SNR 8.71</text>
    </g>
    <g>
      <rect x="428" y="176" width="140" height="96" rx="9" fill="#f8f3ea" stroke="#b8762e" stroke-width="2.4"/>
      <text x="498" y="208" font-size="16" font-weight="700" fill="#8a5518" text-anchor="middle">t = 250</text>
      <text x="498" y="232" font-size="13" fill="#b8762e" text-anchor="middle">신호가 0.724배</text>
      <text x="498" y="252" font-size="13" font-weight="700" fill="#8a5518" text-anchor="middle">SNR 1.10</text>
    </g>
    <g>
      <rect x="618" y="176" width="140" height="96" rx="9" fill="#eef1f6" stroke="#8a97ad" stroke-width="2"/>
      <text x="688" y="208" font-size="16" font-weight="700" fill="#2d3142" text-anchor="middle">t = 500</text>
      <text x="688" y="232" font-size="13" fill="#4f5d75" text-anchor="middle">신호가 0.280배</text>
      <text x="688" y="252" font-size="13" fill="#4f5d75" text-anchor="middle">SNR 0.0853</text>
    </g>
    <g>
      <rect x="808" y="176" width="164" height="96" rx="9" fill="#e9eaef" stroke="#5c6478" stroke-width="2"/>
      <text x="890" y="208" font-size="16" font-weight="700" fill="#2d3142" text-anchor="middle">t = 1000</text>
      <text x="890" y="232" font-size="13" fill="#4f5d75" text-anchor="middle">신호가 0.00635배</text>
      <text x="890" y="252" font-size="13" fill="#4f5d75" text-anchor="middle">사실상 순수 노이즈</text>
    </g>

    <!-- 위쪽: forward -->
    <path d="M 118 168 L 118 128 L 890 128 L 890 168" fill="none" stroke="#c4501f" stroke-width="2.6"/>
    <polygon points="890,174 883,160 897,160" fill="#c4501f"/>
    <rect x="352" y="104" width="300" height="46" rx="7" fill="#fdf1e7" stroke="#c4501f" stroke-width="1.6"/>
    <text x="502" y="124" font-size="15" font-weight="700" fill="#a8410f" text-anchor="middle">노이즈를 넣는 방향</text>
    <text x="502" y="142" font-size="13" fill="#c4501f" text-anchor="middle">미리 정해둔 상수만 쓰고 학습하는 값이 없습니다</text>

    <!-- 아래쪽: reverse -->
    <path d="M 890 280 L 890 322 L 118 322 L 118 280" fill="none" stroke="#2f6f9f" stroke-width="2.6"/>
    <polygon points="118,274 111,288 125,288" fill="#2f6f9f"/>
    <rect x="342" y="336" width="320" height="46" rx="7" fill="#e8f0f7" stroke="#2f6f9f" stroke-width="1.6"/>
    <text x="502" y="356" font-size="15" font-weight="700" fill="#1f4f74" text-anchor="middle">노이즈를 걷어내는 방향</text>
    <text x="502" y="374" font-size="13" fill="#2f6f9f" text-anchor="middle">신경망이 배우는 것은 오직 이 방향 한 스텝입니다</text>

    <!-- 지름길 -->
    <path d="M 118 288 Q 300 420 470 288" fill="none" stroke="#3f7d55" stroke-width="2.2" stroke-dasharray="7,5"/>
    <polygon points="474,283 462,290 470,297" fill="#3f7d55"/>
    <text x="292" y="414" font-size="13.5" font-weight="700" fill="#2c5b3c" text-anchor="middle">지름길: 아무 t로 한 번에 점프</text>
    <text x="292" y="434" font-size="12.5" fill="#3f7d55" text-anchor="middle">중간을 거치지 않아 학습이 가능해집니다</text>

    <text x="700" y="424" font-size="13.5" fill="#4f5d75">SNR은 남은 신호를 쌓인 노이즈로 나눈 값입니다</text>
    <text x="700" y="444" font-size="13.5" fill="#4f5d75">1을 지나는 곳이 t = 259입니다</text>
  </g>
</svg>
