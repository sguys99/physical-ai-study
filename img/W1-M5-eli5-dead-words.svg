    <rect x="40" y="298" width="840" height="76" rx="10" fill="#eef1f5" stroke="#9aa6b2" stroke-width="1.4"/>
    <text x="60" y="326" font-size="13.5" fill="#4f5d75">한 번도 안 쓰인 칸은 고쳐질 기회도 없습니다. 안 쓰였으니 손을 못 대고, 손을 못 대니 계속 안 쓰입니다.</text>
    <text x="60" y="348" font-size="13.5" fill="#4f5d75">이 고리가 이 모듈이 다루는 고장이고, 눈금 방식은 이 고리 자체가 생기지 않게 만듭니다.</text>
