<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-label="지연과 청크 타이밍">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ece9e4"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b3ada4" stroke-width="2.4"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">

    <text x="40" y="46" font-size="22" font-weight="700" fill="#2d3142">상위가 한 번 생각하는 동안 하위는 열 번 움직입니다</text>
    <text x="40" y="74" font-size="15" fill="#4f5d75">조건은 상위 5 Hz, 하위 50 Hz, 추론 100 ms, 통신 20 ms 입니다</text>

    <!-- 세로 기준선: 청크 도착 시점 -->
    <line x1="300" y1="118" x2="300" y2="470" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="600" y1="118" x2="600" y2="470" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- A. 상위 지연 -->
    <text x="40" y="112" font-size="15" font-weight="600" fill="#2d3142">상위가 관측한 뒤 추론 100 ms 와 통신 20 ms 를 거쳐 명령이 도착합니다</text>
    <rect x="120" y="124" width="180" height="40" rx="4" fill="#e7e3dd" stroke="#a7a29a" stroke-width="1"/>
    <text x="210" y="149" font-size="14" fill="#5c564e" text-anchor="middle">지연 120 ms</text>
    <rect x="420" y="124" width="180" height="40" rx="4" fill="#e7e3dd" stroke="#a7a29a" stroke-width="1"/>
    <text x="510" y="149" font-size="14" fill="#5c564e" text-anchor="middle">지연 120 ms</text>
    <text x="120" y="184" font-size="14" fill="#7a8399">상위는 200 ms 마다 처음부터 다시 계산합니다</text>

    <!-- B. 청크 0 해부 -->
    <text x="40" y="212" font-size="15" font-weight="600" fill="#2d3142">청크 0 을 뜯어보면 열여섯 스텝 가운데 앞 여섯 개는 이미 지난 시각입니다</text>
    <rect x="120" y="224" width="180" height="40" rx="4" fill="url(#hatch)" stroke="#a7a29a" stroke-width="1"/>
    <text x="210" y="249" font-size="14" fill="#5c564e" text-anchor="middle">앞 6스텝 폐기</text>
    <rect x="300" y="224" width="300" height="40" rx="4" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="450" y="249" font-size="14" fill="#1f3f70" text-anchor="middle">쓰는 구간 10스텝</text>

    <!-- C. H=16 -->
    <text x="40" y="300" font-size="15" font-weight="600" fill="#2d3142">H = 16 이면 다음 청크가 올 때까지 명령이 끊기지 않습니다</text>
    <rect x="300" y="312" width="300" height="40" rx="4" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="450" y="337" font-size="15" fill="#1f3f70" text-anchor="middle">청크 0</text>
    <rect x="600" y="312" width="300" height="40" rx="4" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="750" y="337" font-size="15" fill="#1f3f70" text-anchor="middle">청크 1</text>

    <!-- D. H=15 -->
    <text x="40" y="388" font-size="15" font-weight="600" fill="#2d3142">H = 15 이면 한 스텝 20 ms 동안 쓸 명령이 없습니다. 전체 시간의 9.6 퍼센트입니다</text>
    <rect x="300" y="400" width="270" height="40" rx="4" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="435" y="425" font-size="15" fill="#1f3f70" text-anchor="middle">청크 0</text>
    <rect x="570" y="400" width="30" height="40" rx="2" fill="#eb6c36"/>
    <rect x="600" y="400" width="270" height="40" rx="4" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="735" y="425" font-size="15" fill="#1f3f70" text-anchor="middle">청크 1</text>
    <text x="585" y="462" font-size="14" font-weight="600" fill="#c4501f" text-anchor="middle">공백 20 ms</text>

    <!-- 축 -->
    <line x1="120" y1="486" x2="930" y2="486" stroke="#4f5d75" stroke-width="1.2"/>
    <g stroke="#7a8399" stroke-width="1">
      <line x1="120" y1="486" x2="120" y2="496"/><line x1="150" y1="486" x2="150" y2="492"/>
      <line x1="180" y1="486" x2="180" y2="492"/><line x1="210" y1="486" x2="210" y2="492"/>
      <line x1="240" y1="486" x2="240" y2="492"/><line x1="270" y1="486" x2="270" y2="496"/>
      <line x1="300" y1="486" x2="300" y2="492"/><line x1="330" y1="486" x2="330" y2="492"/>
      <line x1="360" y1="486" x2="360" y2="492"/><line x1="390" y1="486" x2="390" y2="492"/>
      <line x1="420" y1="486" x2="420" y2="496"/><line x1="450" y1="486" x2="450" y2="492"/>
      <line x1="480" y1="486" x2="480" y2="492"/><line x1="510" y1="486" x2="510" y2="492"/>
      <line x1="540" y1="486" x2="540" y2="492"/><line x1="570" y1="486" x2="570" y2="496"/>
      <line x1="600" y1="486" x2="600" y2="492"/><line x1="630" y1="486" x2="630" y2="492"/>
      <line x1="660" y1="486" x2="660" y2="492"/><line x1="690" y1="486" x2="690" y2="492"/>
      <line x1="720" y1="486" x2="720" y2="496"/><line x1="750" y1="486" x2="750" y2="492"/>
      <line x1="780" y1="486" x2="780" y2="492"/><line x1="810" y1="486" x2="810" y2="492"/>
      <line x1="840" y1="486" x2="840" y2="492"/><line x1="870" y1="486" x2="870" y2="496"/>
      <line x1="900" y1="486" x2="900" y2="492"/><line x1="930" y1="486" x2="930" y2="492"/>
    </g>
    <text x="40" y="516" font-size="14" fill="#7a8399">시간 (ms)</text>
    <text x="120" y="516" font-size="14" fill="#4f5d75" text-anchor="middle">0</text>
    <text x="270" y="516" font-size="14" fill="#4f5d75" text-anchor="middle">100</text>
    <text x="420" y="516" font-size="14" fill="#4f5d75" text-anchor="middle">200</text>
    <text x="570" y="516" font-size="14" fill="#4f5d75" text-anchor="middle">300</text>
    <text x="720" y="516" font-size="14" fill="#4f5d75" text-anchor="middle">400</text>
    <text x="870" y="516" font-size="14" fill="#4f5d75" text-anchor="middle">500</text>
    <text x="120" y="540" font-size="14" fill="#7a8399">눈금 한 칸이 하위 제어기의 한 스텝 20 ms 입니다</text>

    <!-- 범례 -->
    <line x1="40" y1="568" x2="960" y2="568" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="40" y="578" width="24" height="14" rx="2" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="72" y="590" font-size="14" fill="#4f5d75">하위가 실제로 쓰는 명령</text>
    <rect x="340" y="578" width="24" height="14" rx="2" fill="url(#hatch)" stroke="#a7a29a" stroke-width="1"/>
    <text x="372" y="590" font-size="14" fill="#4f5d75">도착했을 때 이미 지난 부분</text>
    <rect x="640" y="578" width="24" height="14" rx="2" fill="#eb6c36"/>
    <text x="672" y="590" font-size="14" fill="#4f5d75">쓸 명령이 없는 공백</text>

    <text x="40" y="622" font-size="14" fill="#4f5d75">H 는 한 청크에 담는 스텝 수입니다. 이 조건에서 필요한 최소값은 16 입니다.</text>
  </g>
</svg>
