    <text x="852" y="334" font-size="13" fill="#2d3142">거의 다 빔</text>

    <rect x="36" y="398" width="888" height="46" rx="8" fill="#eef1f5" stroke="#9aa6b2" stroke-width="1.4"/>
    <text x="56" y="427" font-size="13.5" fill="#4f5d75">색이 찬 칸의 개수는 세 판에서 거의 같고 늘어나는 것은 빈 칸뿐입니다. 표현할 자리를 늘렸는데 늘린 만큼 못 쓰는 것이 이 방식의 고질입니다.</text>
