<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" aria-label="로봇을 움직이는 프로그램의 다섯 층">
  <defs>
    <marker id="eli5ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="830" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">

    <text x="40" y="46" font-size="22" font-weight="700" fill="#2d3142">로봇을 움직이는 프로그램은 다섯 층으로 나뉩니다</text>
    <text x="40" y="74" font-size="15" fill="#4f5d75">위층은 느리게 판단하고 아래층은 빠르게 반응합니다</text>

    <!-- 1층 -->
    <rect x="40" y="104" width="576" height="76" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="632" y="104" width="288" height="76" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="500" y="116" width="92" height="24" rx="4" fill="#eef1f6" stroke="#b9c2d0" stroke-width="1"/>
    <text x="546" y="133" font-size="14" font-weight="700" fill="#4f5d75" text-anchor="middle">맨 위</text>
    <text x="64" y="136" font-size="17" font-weight="700" fill="#2d3142">사람 말을 알아듣고 어디 있는지 찾는 층</text>
    <text x="64" y="164" font-size="14" fill="#4f5d75">말로 한 목표를 갈 곳의 위치로 바꿉니다</text>
    <text x="652" y="138" font-size="16" font-weight="700" fill="#2d3142">1초에 한 번에서 다섯 번</text>
    <text x="652" y="164" font-size="14" fill="#7a8399">천천히 돕니다</text>
    <line x1="104" y1="184" x2="104" y2="220" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar)"/>
    <text x="124" y="211" font-size="14" fill="#4f5d75">갈 곳의 위치</text>

    <!-- 2층 -->
    <rect x="40" y="226" width="576" height="76" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="632" y="226" width="288" height="76" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <text x="64" y="258" font-size="17" font-weight="700" fill="#2d3142">무엇을 할지 정하는 층</text>
    <text x="64" y="286" font-size="14" fill="#4f5d75">앞으로 할 동작 여러 개를 한 묶음으로 내놓습니다</text>
    <text x="652" y="260" font-size="16" font-weight="700" fill="#2d3142">1초에 한 번에서 열 번</text>
    <text x="652" y="286" font-size="14" fill="#7a8399">천천히 돕니다</text>
    <line x1="104" y1="306" x2="104" y2="342" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar)"/>
    <text x="124" y="333" font-size="14" fill="#4f5d75">앞으로 할 동작 묶음</text>

    <!-- 3층 가운데 -->
    <rect x="40" y="348" width="576" height="76" rx="8" fill="#fdeee7" stroke="#eb6c36" stroke-width="1.8"/>
    <rect x="632" y="348" width="288" height="76" rx="8" fill="#fdeee7" stroke="#eb6c36" stroke-width="1.8"/>
    <rect x="500" y="360" width="92" height="24" rx="4" fill="#eb6c36"/>
    <text x="546" y="377" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">승부처</text>
    <text x="64" y="380" font-size="17" font-weight="700" fill="#2d3142">위와 아래를 이어주는 층</text>
    <text x="64" y="408" font-size="14" fill="#4f5d75">위층이 낸 것을 아래층이 알아듣는 형태로 바꿉니다</text>
    <text x="652" y="382" font-size="16" font-weight="700" fill="#2d3142">위층이 부를 때마다 한 번</text>
    <text x="652" y="408" font-size="14" fill="#a8532a">위층에 맞춰 돕니다</text>
    <line x1="104" y1="428" x2="104" y2="464" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar)"/>
    <text x="124" y="455" font-size="14" fill="#4f5d75">아래층이 알아듣는 형태</text>

    <!-- 4층 -->
    <rect x="40" y="470" width="576" height="76" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="632" y="470" width="288" height="76" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <text x="64" y="502" font-size="17" font-weight="700" fill="#2d3142">넘어지지 않게 버티는 층</text>
    <text x="64" y="530" font-size="14" fill="#4f5d75">관절을 얼마나 돌릴지 이번 순간의 자세를 정합니다</text>
    <text x="652" y="504" font-size="16" font-weight="700" fill="#2d3142">1초에 쉰 번에서 오백 번</text>
    <text x="652" y="530" font-size="14" fill="#7a8399">빠르게 돕니다</text>
    <line x1="104" y1="550" x2="104" y2="586" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar)"/>
    <text x="124" y="577" font-size="14" fill="#4f5d75">관절을 얼마나 돌릴지</text>

    <!-- 5층 -->
    <rect x="40" y="592" width="576" height="76" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="632" y="592" width="288" height="76" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <rect x="500" y="604" width="92" height="24" rx="4" fill="#eef1f6" stroke="#b9c2d0" stroke-width="1"/>
    <text x="546" y="621" font-size="14" font-weight="700" fill="#4f5d75" text-anchor="middle">맨 아래</text>
    <text x="64" y="624" font-size="17" font-weight="700" fill="#2d3142">모터에 전류를 흘리는 층</text>
    <text x="64" y="652" font-size="14" fill="#4f5d75">정해진 자세가 되도록 모터를 밉니다</text>
    <text x="652" y="626" font-size="16" font-weight="700" fill="#2d3142">1초에 천 번에서 이천 번</text>
    <text x="652" y="652" font-size="14" fill="#7a8399">가장 빠르게 돕니다</text>

    <line x1="40" y1="704" x2="920" y2="704" stroke="#d9d7d2" stroke-width="1"/>
    <text x="40" y="730" font-size="14" fill="#4f5d75">오른쪽 칸에 적힌 말이 그 층이 1초에 몇 번 도는지입니다.</text>
    <text x="40" y="752" font-size="14" fill="#4f5d75">위쪽 두 층은 어디 있는지 찾고 무엇을 할지 정하는 일이라 조금 걸려도 괜찮습니다.</text>
    <text x="40" y="774" font-size="14" fill="#4f5d75">아래쪽 두 층은 넘어지지 않게 버티고 모터를 미는 일이라 늦으면 안 됩니다.</text>
    <text x="40" y="796" font-size="14" fill="#4f5d75">주황색 테두리를 두른 가운데 층이 우리 회사가 힘을 싣는 자리입니다.</text>
  </g>
</svg>
