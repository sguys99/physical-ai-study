<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" width="1020" height="720" role="img" aria-label="adaLN-Zero를 쓰는 DiT 블록 하나의 구조">
  <rect x="0" y="0" width="1020" height="720" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">

    <text x="40" y="42" font-size="22" font-weight="700" fill="#2d3142">DiT 블록 하나, 조건은 정규화 계수로만 들어옵니다</text>
    <text x="40" y="70" font-size="15" fill="#4f5d75">왼쪽이 조건 경로이고 오른쪽이 토큰 경로입니다. 둘이 만나는 자리는 여섯 곳뿐입니다</text>

    <!-- ===== 왼쪽: 조건 경로 ===== -->
    <rect x="40" y="96" width="330" height="470" rx="10" fill="#fdf6ec" stroke="#c9924b" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="60" y="122" font-size="15" font-weight="700" fill="#8a5518">조건 경로</text>

    <rect x="60" y="140" width="130" height="48" rx="7" fill="#f8f3ea" stroke="#b8762e" stroke-width="1.8"/>
    <text x="125" y="170" font-size="14" fill="#8a5518" text-anchor="middle">확산 스텝 t</text>
    <rect x="212" y="140" width="130" height="48" rx="7" fill="#f8f3ea" stroke="#b8762e" stroke-width="1.8"/>
    <text x="277" y="170" font-size="14" fill="#8a5518" text-anchor="middle">클래스 라벨 y</text>

    <path d="M 125 190 L 125 214 L 201 214" fill="none" stroke="#b8762e" stroke-width="2"/>
    <path d="M 277 190 L 277 214 L 201 214" fill="none" stroke="#b8762e" stroke-width="2"/>
    <line x1="201" y1="214" x2="201" y2="236" stroke="#b8762e" stroke-width="2"/>
    <polygon points="201,242 195,230 207,230" fill="#b8762e"/>

    <rect x="70" y="246" width="262" height="48" rx="7" fill="#f8f3ea" stroke="#b8762e" stroke-width="1.8"/>
    <text x="201" y="268" font-size="14" font-weight="700" fill="#8a5518" text-anchor="middle">두 임베딩 벡터를 더합니다</text>
    <text x="201" y="287" font-size="13" fill="#b8762e" text-anchor="middle">c = Emb(t) + Emb(y),  길이 d</text>

    <line x1="201" y1="296" x2="201" y2="320" stroke="#b8762e" stroke-width="2"/>
    <polygon points="201,326 195,314 207,314" fill="#b8762e"/>

    <rect x="70" y="330" width="262" height="62" rx="7" fill="#fbeae4" stroke="#c4501f" stroke-width="2.6"/>
    <text x="201" y="354" font-size="14" font-weight="700" fill="#a8410f" text-anchor="middle">SiLU 다음 Linear (d → 6d)</text>
    <text x="201" y="376" font-size="13" font-weight="700" fill="#c4501f" text-anchor="middle">★ 이 Linear를 0으로 초기화합니다</text>

    <line x1="201" y1="394" x2="201" y2="416" stroke="#b8762e" stroke-width="2"/>
    <polygon points="201,422 195,410 207,410" fill="#b8762e"/>

    <rect x="70" y="426" width="262" height="118" rx="7" fill="#ffffff" stroke="#b8762e" stroke-width="1.8"/>
    <text x="201" y="450" font-size="14" font-weight="700" fill="#8a5518" text-anchor="middle">여섯 조각으로 자릅니다</text>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="86" y="462" width="70" height="32" rx="5" fill="#f8f3ea" stroke="#b8762e"/><text x="121" y="484" fill="#8a5518">γ₁</text>
      <rect x="166" y="462" width="70" height="32" rx="5" fill="#f8f3ea" stroke="#b8762e"/><text x="201" y="484" fill="#8a5518">β₁</text>
      <rect x="246" y="462" width="70" height="32" rx="5" fill="#fbeae4" stroke="#c4501f" stroke-width="2"/><text x="281" y="484" fill="#a8410f">α₁</text>
      <rect x="86" y="502" width="70" height="32" rx="5" fill="#f8f3ea" stroke="#b8762e"/><text x="121" y="524" fill="#8a5518">γ₂</text>
      <rect x="166" y="502" width="70" height="32" rx="5" fill="#f8f3ea" stroke="#b8762e"/><text x="201" y="524" fill="#8a5518">β₂</text>
      <rect x="246" y="502" width="70" height="32" rx="5" fill="#fbeae4" stroke="#c4501f" stroke-width="2"/><text x="281" y="524" fill="#a8410f">α₂</text>
    </g>

    <text x="60" y="590" font-size="13.5" fill="#4f5d75">여섯 개 모두 토큰 길이 축으로 똑같이 퍼져 들어갑니다</text>
    <text x="60" y="611" font-size="13.5" font-weight="700" fill="#a8410f">주황색 두 개가 Zero라는 이름이 붙은 자리입니다</text>

    <!-- ===== 오른쪽: 토큰 경로 ===== -->
    <rect x="400" y="96" width="580" height="470" rx="10" fill="#f2f5f9" stroke="#8a97ad" stroke-width="1.6" stroke-dasharray="6,4"/>
    <text x="420" y="122" font-size="15" font-weight="700" fill="#2d3142">토큰 경로</text>

    <rect x="480" y="138" width="420" height="42" rx="7" fill="#eef1f6" stroke="#5c6478" stroke-width="2"/>
    <text x="690" y="165" font-size="14" font-weight="700" fill="#2d3142" text-anchor="middle">입력 토큰 h, 크기 [배치, 토큰 256, 폭 1152]</text>

    <!-- 잔차 1 -->
    <path d="M 440 180 L 440 320" fill="none" stroke="#2f6f9f" stroke-width="2.4"/>
    <line x1="480" y1="180" x2="440" y2="180" stroke="#2f6f9f" stroke-width="2.4"/>

    <line x1="690" y1="182" x2="690" y2="196" stroke="#5c6478" stroke-width="2"/>
    <rect x="480" y="198" width="420" height="34" rx="6" fill="#ffffff" stroke="#8a97ad" stroke-width="1.6"/>
    <text x="690" y="221" font-size="13.5" fill="#4f5d75" text-anchor="middle">LayerNorm(층 정규화), 자체 스케일과 시프트는 끕니다</text>

    <line x1="690" y1="232" x2="690" y2="244" stroke="#5c6478" stroke-width="2"/>
    <rect x="480" y="246" width="420" height="34" rx="6" fill="#f8f3ea" stroke="#b8762e" stroke-width="2"/>
    <text x="690" y="269" font-size="13.5" font-weight="700" fill="#8a5518" text-anchor="middle">(1 + γ₁)을 곱하고 β₁을 더합니다</text>
    <line x1="332" y1="478" x2="480" y2="263" stroke="#b8762e" stroke-width="1.6" stroke-dasharray="4,3"/>

    <line x1="690" y1="280" x2="690" y2="292" stroke="#5c6478" stroke-width="2"/>
    <rect x="480" y="294" width="420" height="34" rx="6" fill="#eef1f6" stroke="#5c6478" stroke-width="1.8"/>
    <text x="690" y="317" font-size="13.5" font-weight="700" fill="#2d3142" text-anchor="middle">Multi-Head Self-Attention, 헤드 16개</text>

    <line x1="690" y1="328" x2="690" y2="340" stroke="#5c6478" stroke-width="2"/>
    <rect x="480" y="342" width="420" height="34" rx="6" fill="#fbeae4" stroke="#c4501f" stroke-width="2.4"/>
    <text x="690" y="365" font-size="13.5" font-weight="700" fill="#a8410f" text-anchor="middle">α₁을 곱합니다. 처음에는 α₁ = 0입니다</text>
    <line x1="332" y1="478" x2="480" y2="359" stroke="#c4501f" stroke-width="1.6" stroke-dasharray="4,3"/>

    <line x1="690" y1="376" x2="690" y2="392" stroke="#5c6478" stroke-width="2"/>
    <circle cx="440" cy="400" r="13" fill="#ffffff" stroke="#2f6f9f" stroke-width="2.4"/>
    <text x="440" y="406" font-size="16" font-weight="700" fill="#1f4f74" text-anchor="middle">+</text>
    <path d="M 440 320 L 440 387" fill="none" stroke="#2f6f9f" stroke-width="2.4"/>
    <polygon points="440,393 434,381 446,381" fill="#2f6f9f"/>
    <line x1="690" y1="400" x2="453" y2="400" stroke="#5c6478" stroke-width="2"/>

    <!-- 잔차 2 -->
    <path d="M 440 413 L 440 500" fill="none" stroke="#2f6f9f" stroke-width="2.4"/>
    <rect x="480" y="418" width="420" height="60" rx="7" fill="#ffffff" stroke="#8a97ad" stroke-width="1.8"/>
    <text x="690" y="440" font-size="13.5" fill="#4f5d75" text-anchor="middle">LayerNorm → (1 + γ₂) 곱하고 β₂ 더하기 → MLP (숨은 폭 4d)</text>
    <text x="690" y="464" font-size="13.5" font-weight="700" fill="#a8410f" text-anchor="middle">→ α₂를 곱합니다. 처음에는 α₂ = 0입니다</text>
    <line x1="440" y1="448" x2="480" y2="448" stroke="#2f6f9f" stroke-width="2.4"/>

    <circle cx="440" cy="514" r="13" fill="#ffffff" stroke="#2f6f9f" stroke-width="2.4"/>
    <text x="440" y="520" font-size="16" font-weight="700" fill="#1f4f74" text-anchor="middle">+</text>
    <polygon points="440,507 434,495 446,495" fill="#2f6f9f"/>
    <path d="M 690 478 L 690 514 L 453 514" fill="none" stroke="#5c6478" stroke-width="2"/>

    <line x1="440" y1="527" x2="440" y2="548" stroke="#5c6478" stroke-width="2"/>
    <polygon points="440,554 434,542 446,542" fill="#5c6478"/>
    <text x="460" y="550" font-size="13.5" font-weight="700" fill="#2d3142">다음 블록으로. 이 블록이 28층 쌓여 있습니다</text>

    <!-- 결론 배너 -->
    <rect x="40" y="596" width="940" height="52" rx="9" fill="#e8f0f7" stroke="#2f6f9f" stroke-width="2"/>
    <text x="60" y="628" font-size="16" font-weight="700" fill="#1f4f74">α₁ = α₂ = 0이면 두 잔차 가지가 모두 닫혀 블록이 그냥 통과 장치가 됩니다. 나온 값이 들어간 값과 같습니다</text>

    <text x="40" y="678" font-size="13.5" fill="#4f5d75">마지막 블록 뒤에는 LayerNorm과 한 번 더의 스케일 시프트가 붙고, Linear가 폭을 p² × 2C(C는 잠재 채널 수로 여기서는 4)로 늘린 다음</text>
    <text x="40" y="700" font-size="13.5" fill="#4f5d75">토큰열을 다시 격자로 되돌립니다. 최종 출력은 예측 노이즈와 대각 분산을 합친 [배치, 8, 32, 32]입니다</text>
  </g>
</svg>
