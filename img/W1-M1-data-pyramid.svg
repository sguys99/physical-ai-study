<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" role="img" aria-label="데이터 피라미드">
  <rect x="0" y="0" width="1000" height="690" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">

    <text x="40" y="46" font-size="22" font-weight="700" fill="#2d3142">데이터 피라미드, 위는 많고 아래는 정확합니다</text>
    <text x="40" y="74" font-size="15" fill="#4f5d75">학습에 필요한 것은 그때 관절을 얼마나 돌렸는가인데, 위로 갈수록 그 기록이 없습니다</text>

    <text x="40" y="114" font-size="14" fill="#7a8399">위로 갈수록 양이 많고 액션 라벨이 없습니다</text>

    <!-- 1층 웹 비디오 -->
    <polygon points="60,136 560,136 520,232 100,232" fill="#ece9e4" stroke="#b3ada4" stroke-width="1"/>
    <text x="310" y="190" font-size="16" font-weight="700" fill="#2d3142" text-anchor="middle">① 웹 비디오</text>
    <text x="310" y="214" font-size="14" fill="#5c564e" text-anchor="middle">유튜브 같은 인터넷 영상</text>
    <line x1="546" y1="184" x2="592" y2="184" stroke="#b3ada4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="600" y="178" font-size="15" font-weight="600" fill="#2d3142">수십억 클립</text>
    <text x="600" y="200" font-size="14" font-weight="600" fill="#c4501f">액션 라벨 없음</text>

    <!-- 2층 휴먼 비디오와 모캡 -->
    <polygon points="100,242 520,242 480,338 140,338" fill="#e3e5e6" stroke="#a6adb5" stroke-width="1"/>
    <text x="310" y="296" font-size="16" font-weight="700" fill="#2d3142" text-anchor="middle">② 휴먼 비디오와 모캡</text>
    <text x="310" y="320" font-size="14" fill="#4f5d75" text-anchor="middle">사람 움직임을 찍거나 재어 둔 것</text>
    <line x1="506" y1="290" x2="592" y2="290" stroke="#a6adb5" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="600" y="272" font-size="15" font-weight="600" fill="#2d3142">수백에서 수천 시간</text>
    <text x="600" y="294" font-size="14" font-weight="600" fill="#4f5d75">사람 골격 라벨만</text>
    <text x="600" y="316" font-size="14" fill="#7a8399">SONIC 700시간, 1억 프레임 이상</text>

    <!-- 3층 텔레옵 시연 -->
    <polygon points="140,348 480,348 440,444 180,444" fill="#dfe6f0" stroke="#2e5aa8" stroke-width="1"/>
    <text x="310" y="402" font-size="16" font-weight="700" fill="#2d3142" text-anchor="middle">③ 텔레옵 시연</text>
    <text x="310" y="426" font-size="14" fill="#1f3f70" text-anchor="middle">로봇을 직접 조종해 모은 것</text>
    <line x1="466" y1="396" x2="592" y2="396" stroke="#8fa3c4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="600" y="368" font-size="15" font-weight="600" fill="#2d3142">1만에서 100만 궤적</text>
    <text x="600" y="390" font-size="14" font-weight="600" fill="#2e5aa8">액션 라벨 정확</text>
    <text x="600" y="412" font-size="14" fill="#7a8399">Open X-Embodiment 100만 궤적 이상</text>
    <text x="600" y="434" font-size="14" fill="#7a8399">AgiBot World Beta 1,003,672 궤적</text>

    <!-- 4층 실기 강화학습 -->
    <polygon points="180,454 440,454 400,550 220,550" fill="#cdd9ec" stroke="#2e5aa8" stroke-width="1"/>
    <text x="310" y="508" font-size="16" font-weight="700" fill="#2d3142" text-anchor="middle">④ 실기 강화학습</text>
    <text x="310" y="532" font-size="14" fill="#1f3f70" text-anchor="middle">보상까지 있음</text>
    <line x1="426" y1="502" x2="592" y2="502" stroke="#8fa3c4" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="600" y="496" font-size="15" font-weight="600" fill="#2d3142">가장 적음</text>
    <text x="600" y="518" font-size="14" font-weight="600" fill="#2e5aa8">액션 라벨에 보상까지</text>

    <text x="40" y="582" font-size="14" fill="#7a8399">아래로 갈수록 양이 적고 액션 라벨이 정확합니다</text>

    <line x1="40" y1="610" x2="960" y2="610" stroke="#d9d7d2" stroke-width="1"/>
    <text x="40" y="636" font-size="14" fill="#4f5d75">웹 비디오 수십억 클립과 텔레옵 100만 궤적 사이에는 세 자릿수가 넘는 차이가 있습니다.</text>
    <text x="40" y="658" font-size="14" fill="#4f5d75">위쪽 자료를 어떻게든 끌어내려 쓰는 방법이 지금 연구의 중심입니다.</text>
  </g>
</svg>
