<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="960" height="920" role="img" aria-label="말 한마디가 층을 내려가며 숫자로 바뀌는 길">
  <defs>
    <marker id="eli5ar2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="920" fill="#f8f7f4"/>
  <g font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo','Nanum Gothic',sans-serif">

    <text x="40" y="46" font-size="22" font-weight="700" fill="#2d3142">말 한마디가 층을 내려가며 숫자로 바뀝니다</text>
    <text x="40" y="74" font-size="15" fill="#4f5d75">뜻은 그대로인데 층마다 모양이 달라집니다</text>

    <!-- 사람이 한 말 -->
    <rect x="40" y="96" width="880" height="76" rx="8" fill="#fdeee7" stroke="#eb6c36" stroke-width="1.8"/>
    <text x="64" y="126" font-size="14" fill="#a8532a">사람이 한 말</text>
    <text x="64" y="156" font-size="20" font-weight="700" fill="#2d3142">「빨간 컵 있는 곳으로 가」</text>
    <line x1="120" y1="176" x2="120" y2="198" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar2)"/>

    <!-- 1층 -->
    <rect x="40" y="202" width="300" height="96" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <text x="64" y="242" font-size="15" font-weight="700" fill="#2d3142">사람 말을 알아듣고</text>
    <text x="64" y="266" font-size="15" font-weight="700" fill="#2d3142">어디 있는지 찾는 층</text>
    <rect x="356" y="202" width="564" height="96" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <text x="380" y="232" font-size="15" font-weight="700" fill="#2d3142">갈 곳의 위치</text>
    <text x="380" y="258" font-size="15" font-weight="600" fill="#2e5aa8">2.3, 1.1, 0.8 처럼 숫자 세 개</text>
    <text x="380" y="282" font-size="14" fill="#4f5d75">지도에서 빨간 컵을 찾아 그 자리를 숫자로 적습니다</text>
    <line x1="120" y1="302" x2="120" y2="324" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar2)"/>

    <!-- 2층 -->
    <rect x="40" y="328" width="300" height="96" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <text x="64" y="368" font-size="15" font-weight="700" fill="#2d3142">무엇을 할지</text>
    <text x="64" y="392" font-size="15" font-weight="700" fill="#2d3142">정하는 층</text>
    <rect x="356" y="328" width="564" height="96" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <text x="380" y="358" font-size="15" font-weight="700" fill="#2d3142">앞으로 할 동작 묶음</text>
    <text x="380" y="384" font-size="15" font-weight="600" fill="#2e5aa8">지금 할 동작 하나가 아니라 여러 개를 한꺼번에</text>
    <text x="380" y="408" font-size="14" fill="#4f5d75">위층이 다시 생각할 때까지 아래층이 쓸 몫을 미리 냅니다</text>
    <line x1="120" y1="428" x2="120" y2="450" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar2)"/>

    <!-- 3층 가운데 -->
    <rect x="40" y="454" width="300" height="96" rx="8" fill="#fdeee7" stroke="#eb6c36" stroke-width="1.8"/>
    <text x="64" y="494" font-size="15" font-weight="700" fill="#2d3142">위와 아래를</text>
    <text x="64" y="518" font-size="15" font-weight="700" fill="#2d3142">이어주는 층</text>
    <rect x="356" y="454" width="564" height="96" rx="8" fill="#fdeee7" stroke="#eb6c36" stroke-width="1.8"/>
    <text x="380" y="484" font-size="15" font-weight="700" fill="#2d3142">아래층이 알아듣는 형태</text>
    <text x="380" y="510" font-size="15" font-weight="600" fill="#a8532a">정해진 칸에 맞춰 다듬은 묶음</text>
    <text x="380" y="534" font-size="14" fill="#4f5d75">위층 말투를 아래층 말투로 옮겨 적는 자리입니다</text>
    <line x1="120" y1="554" x2="120" y2="576" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar2)"/>

    <!-- 4층 -->
    <rect x="40" y="580" width="300" height="96" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <text x="64" y="620" font-size="15" font-weight="700" fill="#2d3142">넘어지지 않게</text>
    <text x="64" y="644" font-size="15" font-weight="700" fill="#2d3142">버티는 층</text>
    <rect x="356" y="580" width="564" height="96" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <text x="380" y="610" font-size="15" font-weight="700" fill="#2d3142">관절을 얼마나 돌릴지</text>
    <text x="380" y="636" font-size="15" font-weight="600" fill="#2e5aa8">관절마다 하나씩, 스무 개가 넘는 숫자</text>
    <text x="380" y="660" font-size="14" fill="#4f5d75">넘어지지 않을 자세를 찾아 이번 순간의 각도를 정합니다</text>
    <line x1="120" y1="680" x2="120" y2="702" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#eli5ar2)"/>

    <!-- 5층 -->
    <rect x="40" y="706" width="300" height="96" rx="8" fill="#f1efec" stroke="#d9d7d2" stroke-width="1"/>
    <text x="64" y="746" font-size="15" font-weight="700" fill="#2d3142">모터에 전류를</text>
    <text x="64" y="770" font-size="15" font-weight="700" fill="#2d3142">흘리는 층</text>
    <rect x="356" y="706" width="564" height="96" rx="8" fill="#ffffff" stroke="#d9d7d2" stroke-width="1"/>
    <text x="380" y="736" font-size="15" font-weight="700" fill="#2d3142">모터를 미는 힘</text>
    <text x="380" y="762" font-size="15" font-weight="600" fill="#2e5aa8">정한 각도와 지금 각도의 차이만큼</text>
    <text x="380" y="786" font-size="14" fill="#4f5d75">차이가 크면 세게 밀고 가까워지면 힘을 뺍니다</text>

    <line x1="40" y1="838" x2="920" y2="838" stroke="#d9d7d2" stroke-width="1"/>
    <text x="40" y="864" font-size="14" fill="#4f5d75">내려갈수록 담긴 정보는 줄고 명령은 구체해집니다.</text>
    <text x="40" y="886" font-size="14" fill="#4f5d75">빨간색이라는 말은 아래층까지 내려가지 않고, 아래층이 받는 것은 숫자 몇 개뿐입니다.</text>
  </g>
</svg>
